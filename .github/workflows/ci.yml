name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret scan
        run: npm run secretlint
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Nothing private is tracked
        run: |
          bad=$(git ls-files memory/private | grep -v '^memory/private/\.gitkeep$' || true)
          if [ -n "$bad" ]; then echo "Tracked private files:"; echo "$bad"; exit 1; fi
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
